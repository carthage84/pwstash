[package]
name = "pwstash"
version = "0.1.0"
authors = ["carthage84 <carthage84@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.97"
description = "Simple encrypted password vault with CLI and terminal UI"

[dependencies]
arboard = "3"
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.4"
rand = "0.8"
ratatui = "0.30"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["std", "derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"
