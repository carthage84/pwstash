[package]
name = "pwstash"
version = "0.1.0"
authors = ["carthage84 <carthage84@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.97"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
clap = { version = "4.5.5", features = ["derive"] }
clap_derive = "4.5.5"
crossterm = "0.27.0"
rand = "0.8"
ratatui = "0.26.3"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["std", "derive"] }

[dev-dependencies]
tempfile = "3"
